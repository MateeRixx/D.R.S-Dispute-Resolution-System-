server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location /auth/ {
        proxy_pass http://backend:8000/auth/;
        proxy_set_header Host $host;
    }

    location /portal/ {
        proxy_pass http://backend:8000/portal/;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    location /evidence/ {
        proxy_pass http://backend:8000/evidence/;
        proxy_set_header Host $host;
        client_max_body_size 20m;
    }

    location /disputes/ {
        proxy_pass http://backend:8000/disputes/;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
    }

    location /users/ {
        proxy_pass http://backend:8000/users/;
        proxy_set_header Host $host;
    }

    location /merchants/ {
        proxy_pass http://backend:8000/merchants/;
        proxy_set_header Host $host;
    }

    location /webhooks/ {
        proxy_pass http://backend:8000/webhooks/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
